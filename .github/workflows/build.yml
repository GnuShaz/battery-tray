name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
 
# нужно, чтобы job мог создавать релиз
permissions:
  contents: write
 
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/battery-tray.exe battery-tray.exe
          $hash = (Get-FileHash battery-tray.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  battery-tray.exe" | Out-File -Encoding ascii battery-tray.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: battery-tray
          path: |
            battery-tray.exe
            battery-tray.exe.sha256
      # релиз создаётся только при пуше тега вида v0.1.0
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            battery-tray.exe
            battery-tray.exe.sha256
          generate_release_notes: true
          prerelease: true
 