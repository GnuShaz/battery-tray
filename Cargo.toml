[package]
name = "battery-tray"
version = "0.1.0"
edition = "2021"
description = "Заряд беспроводных устройств в трее Windows"
license = "GPL-3.0-only"

[dependencies]
resvg = "0.45"
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
slint = { version = "1.9", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
hidapi = "2"
auto-launch = "0.5"
notify-rust = "4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
